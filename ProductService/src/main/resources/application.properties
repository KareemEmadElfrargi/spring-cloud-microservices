spring.application.name=product-service

server.port=9090
# Database URL, Username, and Password
spring.datasource.url=jdbc:postgresql://localhost:5432/microservice_db_lab1
spring.datasource.username=postgres
spring.datasource.password=3836

# 'update' will create/modify tables automatically based on your Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Config of Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Make Cache Updated every 5s
spring.cloud.loadbalancer.cache.ttl=5s

# Config for Resilence
resilience4j.retry.instances.product-api.max-attempts=2
resilience4j.retry.instances.product-api.wait-duration=3s



